<div class="container">
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white border-bottom py-3 d-flex flex-wrap align-items-center justify-content-between gap-2">
      <div>
        <h2 class="h5 fw-bold mb-0 text-slate-800">
          <i class="bi bi-kanban text-primary me-2"></i> Lista de Projetos
        </h2>
        <span class="text-muted small">Contratos e iniciativas com consultores alocados</span>
      </div>
      <button (click)="newProjeto()" class="btn btn-primary btn-sm d-inline-flex align-items-center gap-1.5 shadow-sm">
        <i class="bi bi-plus-lg"></i>
        <span>Novo Projeto</span>
      </button>
    </div>

    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th style="width: 90px;">ID</th>
              <th>Nome do Projeto</th>
              <th>Cliente / Contratante</th>
              <th style="width: 200px;" class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let projeto of projetos">
              <td class="text-muted fw-semibold">#{{ projeto.id }}</td>
              <td class="fw-semibold text-slate-800">
                <i class="bi bi-folder-fill me-2 text-primary opacity-75"></i>
                {{ projeto.nome }}
              </td>
              <td>
                <span class="badge bg-light text-dark border">
                  <i class="bi bi-building me-1 text-muted"></i>
                  {{ projeto.clienteNome || 'Cliente #' + projeto.clienteId }}
                </span>
              </td>
              <td class="text-end">
                <button (click)="editProjeto(projeto.id!)" class="btn btn-outline-primary btn-sm me-1.5" title="Editar">
                  <i class="bi bi-pencil"></i>
                  <span class="d-none d-md-inline ms-1">Editar</span>
                </button>
                <button (click)="deleteProjeto(projeto.id!)" class="btn btn-outline-danger btn-sm" title="Excluir">
                  <i class="bi bi-trash"></i>
                  <span class="d-none d-md-inline ms-1">Excluir</span>
                </button>
              </td>
            </tr>
            <tr *ngIf="!projetos || projetos.length === 0">
              <td colspan="4" class="text-center py-4 text-muted">
                <i class="bi bi-inbox fs-3 d-block mb-2 text-muted"></i>
                Nenhum projeto cadastrado no momento.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
