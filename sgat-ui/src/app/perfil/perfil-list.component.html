<div class="container">
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white border-bottom py-3 d-flex flex-wrap align-items-center justify-content-between gap-2">
      <div>
        <h2 class="h5 fw-bold mb-0 text-slate-800">
          <i class="bi bi-person-lines-fill text-primary me-2"></i> Perfis Profissionais
        </h2>
        <span class="text-muted small">Cargos, papéis técnicos e taxas de referência</span>
      </div>
      <button (click)="newPerfil()" class="btn btn-primary btn-sm d-inline-flex align-items-center gap-1.5 shadow-sm">
        <i class="bi bi-plus-lg"></i>
        <span>Novo Perfil</span>
      </button>
    </div>

    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th style="width: 80px;">ID</th>
              <th>Descrição do Perfil</th>
              <th>Valor/Hora Padrão</th>
              <th>Carga Horária Padrão</th>
              <th style="width: 180px;" class="text-end">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let perfil of perfis">
              <td class="text-muted fw-semibold">#{{ perfil.id }}</td>
              <td class="fw-semibold text-slate-800">{{ perfil.descricao }}</td>
              <td class="fw-bold text-success">{{ perfil.valorHoraPadrao | currency:'BRL' }}</td>
              <td>
                <span class="badge bg-light text-dark border">
                  {{ perfil.horasPadrao }}h / mês
                </span>
              </td>
              <td class="text-end">
                <button (click)="editPerfil(perfil.id!)" class="btn btn-outline-primary btn-sm me-1.5" title="Editar">
                  <i class="bi bi-pencil"></i>
                  <span class="d-none d-md-inline ms-1">Editar</span>
                </button>
                <button (click)="deletePerfil(perfil.id!)" class="btn btn-outline-danger btn-sm" title="Excluir">
                  <i class="bi bi-trash"></i>
                  <span class="d-none d-md-inline ms-1">Excluir</span>
                </button>
              </td>
            </tr>
            <tr *ngIf="!perfis || perfis.length === 0">
              <td colspan="5" class="text-center py-4 text-muted">
                <i class="bi bi-inbox fs-3 d-block mb-2 text-muted"></i>
                Nenhum perfil cadastrado no momento.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
